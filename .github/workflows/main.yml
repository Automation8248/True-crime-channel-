name: Daily Crime Short Automation

on:
  schedule:
    - cron: '0 12 * * *' # Roz dopahar 12 baje (UTC) run hoga
  workflow_dispatch: # Manual run button ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests edge-tts moviepy==1.0.3 nest_asyncio

    - name: Run Video Generator
      run: python main.py
